# Prüfungen im Container: Instanz mit Testinhalten, Chrome ohne Oberfläche, Prüflauf. Nichts wird nach außen geöffnet.
#   docker compose -p spur-test -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from pruefer
#   docker compose -p spur-test -f compose.test.yaml down -v
services:
  # nicht „app“ nennen: .app ist eine HSTS-Top-Level-Domain, Chrome erzwingt dafür https
  spur:
    build: .
    environment:
      SPUR_INHALTE: ${SPUR_TEST_INHALTE:-/inhalt}
      SPUR_OEFFENTLICHE_URL: http://spur:8080
      SPUR_ATTRAPPE: "1"
      SPUR_WERKSTATT: "1"
      SPUR_VERWALTUNG_SCHLUESSEL: TEST-VERWALTUNG
      SPUR_AUSSTELLUNG_TOKEN: test-ausstellung
      SPUR_MESSWERTE_TOKEN: test-messwerte
    volumes:
      - ./test/fixtures/inhalt:/inhalt:ro
    tmpfs:
      - /daten:mode=1777

  browser:
    image: chromedp/headless-shell:latest
    shm_size: 1gb

  pruefer:
    image: node:24-alpine
    network_mode: "service:browser"
    working_dir: /app
    user: "${UID_GID:-1000:1000}"
    environment:
      APP_URL: http://spur:8080
      AUSGABE: ${AUSGABE:-nachweis/tmp}
      NODE_NO_WARNINGS: "1"
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      spur:
        condition: service_healthy
      browser:
        condition: service_started
    command: ["node", "${PRUEFSKRIPT:-test/e2e/rauchtest.js}"]
