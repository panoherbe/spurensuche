<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Spiel testen – Spurensuche</title>
  <link rel="stylesheet" href="vorschau.css">
  <script type="module" src="vorschau.js"></script>
</head>
<body data-seite="spiel">
  <header class="vs-kopf">
    <div>
      <h1 id="vs-titel">Spiel testen</h1>
      <p>Testseite der Spiele: läuft ohne App, mit denselben Einstellungen, die die App übergibt.</p>
    </div>
    <form class="vs-regler" id="vs-regler">
      <fieldset class="vs-regler">
        <legend>Einstellungen</legend>
        <label>Sprache
          <select name="sprache"><option value="standard">Standard</option><option value="einfach">Einfach</option></select>
        </label>
        <label>Tempo
          <select name="tempo"><option value="0.5">0,5</option><option value="0.75">0,75</option><option value="1" selected>1</option><option value="1.25">1,25</option><option value="1.5">1,5</option></select>
        </label>
        <label><input type="checkbox" name="kontrast"> Hoher Kontrast</label>
        <label><input type="checkbox" name="ruhig"> Wenig Bewegung</label>
        <label><input type="checkbox" name="dunkel"> Dunkel</label>
        <button class="vs-knopf" type="submit">Neu starten</button>
        <a class="vs-knopf" href="index.html">Alle Spiele</a>
      </fieldset>
    </form>
  </header>
  <main class="vs-haupt">
    <section id="wurzel" class="vs-buehne" aria-label="Spiel"></section>
    <section class="vs-protokoll" aria-labelledby="vs-protokoll-titel">
      <h2 id="vs-protokoll-titel">Ereignisse und Ergebnis</h2>
      <p id="vs-pruefung"></p>
      <pre id="vs-ausgabe" tabindex="0" role="region" aria-label="Ereignisse als JSON"></pre>
    </section>
  </main>
</body>
</html>
